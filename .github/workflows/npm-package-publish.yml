name: npm package publish

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version used to publish'
        type: string
        default: '24'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node ${{ inputs.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Upgrade npm to 12
        run: npm install -g npm@12.0.1
      # DEVOPS-524: setup-node writes the legacy `always-auth` key into its
      # generated userconfig whenever registry-url is set. npm 12 removed the
      # key, and the repo's strict-npmrc=true baseline (DEVOPS-501) turns the
      # old "unknown config" warning into a hard EUNKNOWNCONFIG error at the
      # very next npm invocation -- which killed the v4.2.0 release publish.
      # Strip it after the npm upgrade; the auth token line setup-node also
      # writes (_authToken) is still valid and untouched.
      - name: Strip legacy always-auth from setup-node's userconfig (npm 12 rejects it)
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/^always-auth[ =]/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - name: Install dependencies
        run: sfw npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --if-present
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
