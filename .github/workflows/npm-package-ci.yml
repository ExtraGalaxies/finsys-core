name: npm package CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node.js versions to test against'
        type: string
        default: '[24]'

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Upgrade npm to 12
        run: npm install -g npm@12.0.1
      - name: Install dependencies
        run: sfw npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --if-present
      - name: Lint
        run: npm run lint --if-present
      # Typecheck a CONSUMER of the built tarball with skipLibCheck: false —
      # tsc's default, and the one setting our own tsconfig disables. Optional
      # peers are not installed into the fixture, on purpose: a .d.ts that
      # references one is the consumer's TS2307, and this repo's suite is
      # blind to it (SYS-3420). Packages without a test:consumer script skip.
      - name: Consumer typecheck (skipLibCheck=false, no optional peers)
        run: npm run test:consumer --if-present
