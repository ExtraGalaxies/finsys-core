name: npm package publish

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version used to publish'
        type: string
        default: '24'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node ${{ inputs.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - name: Upgrade npm to 12
        run: npm install -g npm@12.0.1
      # DEVOPS-524: setup-node writes the legacy `always-auth` key into its
      # generated userconfig whenever registry-url is set. npm 12 removed the
      # key, and the repo's strict-npmrc=true baseline (DEVOPS-501) turns the
      # old "unknown config" warning into a hard EUNKNOWNCONFIG error at the
      # very next npm invocation -- which killed the v4.2.0 release publish.
      # Strip it after the npm upgrade; the auth token line setup-node also
      # writes (_authToken) is still valid and untouched.
      - name: Strip legacy always-auth from setup-node's userconfig (npm 12 rejects it)
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/^always-auth[ =]/d' "$NPM_CONFIG_USERCONFIG"
          fi
      - name: Install dependencies
        run: sfw npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test --if-present
      # DEVOPS-687: block a release that is not ready, rather than discovering
      # it afterwards on a public registry where nothing can be taken back.
      #
      # Every check here corresponds to something that actually went wrong on
      # 2026-08-13/14, and every one of them was found by a human noticing
      # rather than by anything executing. They share one shape: a DECLARED
      # fact drifting from an ACTUAL one, with nothing comparing the two.
      #
      # Lives in the shared workflow on purpose. Both packages already call
      # this file, so there is one copy to maintain and no per-repo version to
      # go stale — which is the same failure the checks themselves are about.
      - name: Preflight — refuse to publish something that is not ready
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cat > /tmp/preflight.mjs <<'PREFLIGHT'
          import { readFileSync, existsSync } from "node:fs"

          const fail = []
          const pkg = JSON.parse(readFileSync("package.json", "utf8"))
          const { name, version } = pkg
          console.log(`preflight: ${name}@${version}`)

          const registry = async (n) => {
            const r = await fetch(`https://registry.npmjs.org/${n}`)
            if (r.status === 404) return null
            if (!r.ok) throw new Error(`registry ${r.status} for ${n}`)
            return r.json()
          }

          // 1. ALREADY PUBLISHED. npm rejects a duplicate anyway, but it does so
          //    after build+test have run and with an error that reads like an
          //    auth problem. Saying it up front is the difference between "you
          //    forgot the version bump" and ten minutes of log reading.
          const own = await registry(name)
          if (own?.versions?.[version]) {
            fail.push(`${name}@${version} is already on npm. Bump the version — a release cannot republish.`)
          }

          // 2. TAG vs package.json. A release tagged v7.0.0 against a tree that
          //    still says 6.0.2 publishes 6.0.2 and reports success, and the tag
          //    then lies about what shipped forever.
          const tag = process.env.RELEASE_TAG
          if (tag && tag.replace(/^v/, "") !== version) {
            fail.push(`release tag ${tag} does not match package.json version ${version}.`)
          }

          // 3. CHANGELOG. For a public package this is the primary artifact a
          //    consumer reads to learn what broke. 7.0.0 was about to publish
          //    over "## [Unreleased]", and the toolkit's had silently stopped
          //    three versions earlier.
          if (!existsSync("CHANGELOG.md")) {
            fail.push(`no CHANGELOG.md. A public package needs one before it publishes.`)
          } else {
            const log = readFileSync("CHANGELOG.md", "utf8")
            // Accepts "## 1.2.3", "## [1.2.3]", with or without a trailing date.
            const has = new RegExp(`^##\\s*\\[?${version.replace(/\\./g, "\\\\.")}\\]?`, "m").test(log)
            if (!has) fail.push(`CHANGELOG.md has no entry for ${version}.`)
          }

          // 4. PEER RANGES vs what that peer actually publishes. The toolkit
          //    declared "@finsys/core: >=6.0.1 <7" hours before core released
          //    7.0.0 — so installing the pair would have produced an
          //    unsatisfiable peer, which is exactly the breakage the peer
          //    declaration existed to prevent.
          //
          //    Deliberately NOT a full semver implementation, and deliberately
          //    FAIL-CLOSED on a shape it does not recognise. A range parser
          //    that silently passes what it cannot read is worse than no check:
          //    it reports confidence it has not earned.
          const admitsMajorClause = (clause, major) => {
            const upper = clause.match(/<\s*(\d+)/)
            if (upper) {
              const lower = clause.match(/>=\s*(\d+)/)
              const okLower = lower ? major >= Number(lower[1]) : true
              return okLower && major < Number(upper[1]) ? true : false
            }
            const caret = clause.match(/^\^\s*(\d+)\./)
            if (caret) return major === Number(caret[1])
            const exact = clause.match(/^\s*(\d+)\.\d+\.\d+\s*$/)
            if (exact) return major === Number(exact[1])
            return null // unrecognised — caller fails closed
          }

          //    A union ("^2.5.0 || ^3.0.0") admits `major` if ANY clause does.
          //    Splitting first is not cosmetic: run against the whole string,
          //    the `<` and `^` probes above match the FIRST clause only and
          //    return a confident verdict for the union — so "^2.5.0 || ^3.0.0"
          //    was reported as excluding a latest of 3. That is a WRONG ANSWER,
          //    not a fail-closed, which is the one thing this parser is not
          //    allowed to produce. (DEVOPS-688)
          const admitsMajor = (range, major) => {
            const clauses = String(range).split("||").map((c) => c.trim()).filter(Boolean)
            if (clauses.length === 0) return null
            const verdicts = clauses.map((c) => admitsMajorClause(c, major))
            if (verdicts.some((v) => v === true)) return true // one satisfied clause is enough
            if (verdicts.some((v) => v === null)) return null // otherwise an unreadable clause is decisive
            return false
          }

          for (const [peer, range] of Object.entries(pkg.peerDependencies ?? {})) {
            const meta = await registry(peer)
            const latest = meta?.["dist-tags"]?.latest
            if (!latest) {
              fail.push(`peerDependency ${peer} has no published latest to check against.`)
              continue
            }
            const major = Number(latest.split(".")[0])
            const verdict = admitsMajor(range, major)
            if (verdict === null) {
              fail.push(
                `peerDependency ${peer} range "${range}" is a shape this preflight cannot read. ` +
                  `Extend admitsMajor() rather than loosening the check.`
              )
            } else if (!verdict) {
              fail.push(
                `peerDependency ${peer} range "${range}" excludes its current latest ${latest}. ` +
                  `Installing this package alongside a current ${peer} would fail to resolve.`
              )
            } else {
              console.log(`  ok: ${peer} "${range}" admits latest ${latest}`)
            }
          }

          if (fail.length) {
            console.error(`\nPREFLIGHT FAILED — not publishing ${name}@${version}:\n`)
            for (const f of fail) console.error(`  - ${f}`)
            console.error(
              `\nNothing was published. Fix the above, then re-run this workflow ` +
                `(Publish has a workflow_dispatch lever) or recreate the release.\n`
            )
            process.exit(1)
          }
          console.log("preflight: ok")
          PREFLIGHT
          node /tmp/preflight.mjs
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
